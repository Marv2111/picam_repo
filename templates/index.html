<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Grader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>⚡ Pokémon Card Grader</h1>
        <nav class="tabs">
            <button class="tab active" onclick="showTab('scanner')">📷 Scanner</button>
            <button class="tab" onclick="showTab('collection')">📦 Collection <span id="colBadge" class="badge">{{ col_count }}</span></button>
        </nav>
    </header>

    <!-- ==================== SCANNER TAB ==================== -->
    <main id="tab-scanner">
        <section class="video-panel">
            <div class="video-container">
                <img src="/video_feed" alt="Live Camera Feed" id="videoFeed">
                <div class="video-overlay" id="statusOverlay">Connecting...</div>
            </div>
            <div class="video-footer">
                <span id="fpsDisplay">-- FPS</span>
                <span>DB: {{ ref_count }} Pokémon</span>
            </div>
        </section>

        <section class="results-panel">
            <div class="card-info" id="cardInfo">
                <div class="info-placeholder">
                    <p>📷 Point the camera at a Pokémon card</p>
                    <p class="hint">Place the card on a dark, contrasting surface</p>
                </div>
            </div>
        </section>
    </main>

    <!-- ==================== COLLECTION TAB ==================== -->
    <main id="tab-collection" style="display:none;">
        <section class="collection-panel">
            <div class="collection-header">
                <h2>My Collection</h2>
                <div class="collection-stats" id="collectionStats">Loading...</div>
            </div>
            <div class="collection-list" id="collectionList">
                <p class="hint">Loading collection...</p>
            </div>
        </section>
    </main>

    <script>
    /* ========== TAB SWITCHING ========== */
    function showTab(tab) {
        document.querySelectorAll('main').forEach(m => m.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab).style.display = 'flex';
        event.target.classList.add('active');
        if (tab === 'collection') loadCollection();
    }

    /* ========== VIDEO FEED ========== */
    const videoFeed = document.getElementById('videoFeed');
    const statusOverlay = document.getElementById('statusOverlay');
    videoFeed.onload = () => { statusOverlay.style.display = 'none'; };
    videoFeed.onerror = () => { statusOverlay.textContent = 'Camera unavailable'; };

    /* ========== GRADE HELPERS ========== */
    function gradeClass(grade) {
        return { 'Mint':'grade-mint','Near Mint':'grade-nm','Excellent':'grade-ex','Good':'grade-good','Poor':'grade-poor' }[grade] || '';
    }

    function defectBar(score) {
        const pct = Math.round(score * 100);
        let color = '#4caf50';
        if (pct > 60) color = '#f44336';
        else if (pct > 30) color = '#ff9800';
        else if (pct > 10) color = '#ffeb3b';
        return `<div class="defect-bar"><div class="defect-fill" style="width:${pct}%;background:${color}"></div></div>`;
    }

    /* ========== RENDER SCANNER RESULTS ========== */
    function renderResults(data) {
        const el = document.getElementById('cardInfo');
        const fpsEl = document.getElementById('fpsDisplay');

        if (!data.cards || data.cards.length === 0) {
            el.innerHTML = `<div class="info-placeholder"><p>📷 Point the camera at a Pokémon card</p><p class="hint">Place the card on a dark, contrasting surface</p></div>`;
            return;
        }

        if (data.fps) fpsEl.textContent = data.fps.toFixed(1) + ' FPS';

        let html = '';
        data.cards.forEach((card, i) => {
            const gc = gradeClass(card.grade);
            const hasNumber = card.card_number && card.card_number.length > 0;
            const cardId = `card-${i}`;

            html += `
            <div class="card-result" id="${cardId}">
                <div class="card-header">
                    <h2>${card.name}</h2>
                    <span class="confidence">${(card.confidence * 100).toFixed(0)}%</span>
                </div>

                ${hasNumber ? `<div class="card-number-tag">📋 ${card.card_number}</div>` : ''}
                ${card.method ? `<div class="method-tag">${card.method}${card.raw_ocr ? ` — "${card.raw_ocr}"` : ''}</div>` : ''}

                <div class="grade-display ${gc}">
                    <span class="grade-label">Grade</span>
                    <span class="grade-value">${card.grade}</span>
                    <span class="grade-score">${(card.score * 100).toFixed(1)}% defect</span>
                </div>

                <div class="defect-list">
                    <h3>Defects</h3>
                    ${Object.entries(card.defects).map(([key, val]) => `
                        <div class="defect-row">
                            <span class="defect-name">${key.replace(/_/g, ' ')}</span>
                            ${defectBar(val)}
                            <span class="defect-detail">${card.details[key]}</span>
                        </div>
                    `).join('')}
                </div>

                <!-- Price lookup + Save -->
                <div class="price-section" id="price-${i}">
                    <button class="btn btn-price" onclick="lookupPrice('${card.name}', '${card.card_number || ''}', ${i})">
                        💰 Look up Price
                    </button>
                </div>

                <div class="save-section">
                    <button class="btn btn-save" onclick="saveCard(${i})" id="save-btn-${i}">
                        💾 Save to Collection
                    </button>
                </div>
            </div>`;
        });

        el.innerHTML = html;
        // Store current data for save
        window._currentCards = data.cards;
    }

    /* ========== PRICE LOOKUP ========== */
    window._prices = {};

    async function lookupPrice(name, number, idx) {
        const el = document.getElementById('price-' + idx);
        el.innerHTML = '<div class="loading">Looking up on Cardmarket...</div>';

        try {
            const params = new URLSearchParams({ name, number });
            const res = await fetch('/lookup_price?' + params);
            const data = await res.json();
            window._prices[idx] = data;

            if (data.found) {
                el.innerHTML = `
                    <div class="price-result">
                        <div class="price-name">${data.name || name}</div>
                        <div class="price-values">
                            ${data.price_trend && data.price_trend !== 'N/A' ? `<span class="price-tag">Trend: <strong>${data.price_trend}</strong></span>` : ''}
                            ${data.price_avg && data.price_avg !== 'N/A' ? `<span class="price-tag">Avg: <strong>${data.price_avg}</strong></span>` : ''}
                            ${data.price_low && data.price_low !== 'N/A' ? `<span class="price-tag">Low: <strong>${data.price_low}</strong></span>` : ''}
                        </div>
                        ${data.url ? `<a href="${data.url}" target="_blank" class="cm-link">View on Cardmarket →</a>` : ''}
                    </div>`;
            } else {
                el.innerHTML = `<div class="price-error">Not found: ${data.error || 'Unknown error'}</div>
                    <button class="btn btn-price" onclick="lookupPrice('${name}', '${number}', ${idx})">Retry</button>`;
            }
        } catch (e) {
            el.innerHTML = `<div class="price-error">Lookup failed: ${e.message}</div>
                <button class="btn btn-price" onclick="lookupPrice('${name}', '${number}', ${idx})">Retry</button>`;
        }
    }

    /* ========== SAVE CARD ========== */
    async function saveCard(idx) {
        const card = window._currentCards[idx];
        const price = window._prices[idx] || {};
        const btn = document.getElementById('save-btn-' + idx);
        btn.textContent = 'Saving...';
        btn.disabled = true;

        const payload = {
            name: card.name,
            card_number: card.card_number || '',
            set_name: '',
            grade: card.grade,
            grade_score: card.score,
            price_avg: price.price_avg || 'N/A',
            price_low: price.price_low || 'N/A',
            price_trend: price.price_trend || 'N/A',
            cardmarket_url: price.url || '',
            defects: card.defects,
        };

        try {
            const res = await fetch('/save_card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (data.success) {
                btn.textContent = '✅ Saved!';
                btn.classList.add('btn-saved');
                updateColBadge();
            } else {
                btn.textContent = '❌ Error';
                btn.disabled = false;
            }
        } catch (e) {
            btn.textContent = '❌ Failed';
            btn.disabled = false;
        }
    }

    /* ========== COLLECTION ========== */
    async function loadCollection() {
        const listEl = document.getElementById('collectionList');
        const statsEl = document.getElementById('collectionStats');

        try {
            const res = await fetch('/collection');
            const data = await res.json();

            // Stats
            const v = data.value;
            statsEl.innerHTML = `
                <span>${v.total_count} cards</span>
                <span>•</span>
                <span>Est. value: <strong>€${v.total_eur.toFixed(2)}</strong> (${v.priced_count} priced)</span>
            `;

            if (data.cards.length === 0) {
                listEl.innerHTML = '<p class="hint">No cards saved yet. Scan a card and click "Save to Collection".</p>';
                return;
            }

            let html = '<table class="collection-table"><thead><tr>'
                + '<th>Name</th><th>#</th><th>Grade</th><th>Avg Price</th><th>Saved</th><th></th>'
                + '</tr></thead><tbody>';

            data.cards.forEach(card => {
                const gc = gradeClass(card.grade);
                html += `<tr>
                    <td><strong>${card.name}</strong></td>
                    <td>${card.card_number || '-'}</td>
                    <td><span class="grade-pill ${gc}">${card.grade}</span></td>
                    <td>${card.price_avg || 'N/A'}</td>
                    <td class="date-cell">${card.saved_at}</td>
                    <td>
                        ${card.cardmarket_url ? `<a href="${card.cardmarket_url}" target="_blank" class="cm-link-small">CM</a>` : ''}
                        <button class="btn-delete" onclick="deleteCard(${card.id})">🗑</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table>';
            listEl.innerHTML = html;
        } catch (e) {
            listEl.innerHTML = `<p class="hint">Error loading collection: ${e.message}</p>`;
        }
    }

    async function deleteCard(id) {
        if (!confirm('Delete this card from collection?')) return;
        try {
            await fetch('/delete_card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id }),
            });
            loadCollection();
            updateColBadge();
        } catch (e) {
            alert('Delete failed');
        }
    }

    async function updateColBadge() {
        try {
            const res = await fetch('/collection');
            const data = await res.json();
            document.getElementById('colBadge').textContent = data.cards.length;
        } catch (e) {}
    }

    /* ========== POLLING ========== */
    async function fetchResults() {
        try {
            const res = await fetch('/results');
            const data = await res.json();
            renderResults(data);
        } catch (e) {}
    }
    setInterval(fetchResults, 500);
    </script>
</body>
</html>
