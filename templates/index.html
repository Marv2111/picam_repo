<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Grader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>⚡ Pokémon Card Grader</h1>
        <nav class="tabs">
            <button class="tab active" onclick="showTab('scanner')">📷 Scanner</button>
            <button class="tab" onclick="showTab('collection')">📦 Collection <span class="badge" id="colBadge">0</span></button>
        </nav>
    </header>

    <!-- ===== SCANNER ===== -->
    <main id="tab-scanner">
        <section class="video-panel">
            <div class="video-container">
                <img src="/video_feed" id="videoFeed" alt="Camera">
            </div>
            <button class="scan-btn" id="scanBtn" onclick="doScan()">
                📷 SCAN CARD
            </button>
            <p class="scan-hint">Align the card inside the guide frame, then press Scan</p>
        </section>

        <section class="results-panel" id="resultsPanel">
            <div class="info-placeholder" id="placeholder">
                <p>📷 Align a card and press Scan</p>
                <p class="hint">The guide frame on the video shows where to place it</p>
            </div>
            <div id="scanResult" style="display:none;"></div>
            <div id="autoResult" class="auto-result-box" style="display:none;"></div>
        </section>
    </main>

    <!-- ===== COLLECTION ===== -->
    <main id="tab-collection" style="display:none;">
        <section class="collection-panel">
            <div class="collection-header">
                <h2>My Collection</h2>
                <div class="collection-stats" id="colStats"></div>
            </div>
            <div id="colList"><p class="hint">Loading...</p></div>
        </section>
    </main>

<script>
function showTab(t) {
    document.querySelectorAll('main').forEach(m => m.style.display = 'none');
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + t).style.display = 'flex';
    event.target.closest('.tab').classList.add('active');
    if (t === 'collection') loadCollection();
}

function gc(grade) {
    return {'Mint':'grade-mint','Near Mint':'grade-nm','Excellent':'grade-ex',
            'Good':'grade-good','Poor':'grade-poor'}[grade] || '';
}
function defBar(score) {
    const pct = Math.round(score * 100);
    let col = '#4caf50';
    if (pct > 60) col = '#f44336';
    else if (pct > 30) col = '#ff9800';
    else if (pct > 10) col = '#ffeb3b';
    return `<div class="defect-bar"><div class="defect-fill" style="width:${pct}%;background:${col}"></div></div>`;
}

/* === SCAN === */
let _lastScan = null;
let _price = null;

async function doScan() {
    const btn = document.getElementById('scanBtn');
    btn.textContent = '⏳ Scanning...';
    btn.disabled = true;

    try {
        const res = await fetch('/scan', { method: 'POST' });
        const data = await res.json();
        _lastScan = data;
        _price = null;
        renderScan(data);
    } catch (e) {
        document.getElementById('scanResult').innerHTML =
            `<div class="error">Scan failed: ${e.message}</div>`;
    }
    btn.textContent = '📷 SCAN CARD';
    btn.disabled = false;
}

function renderScan(d) {
    document.getElementById('placeholder').style.display = 'none';
    const el = document.getElementById('scanResult');
    el.style.display = 'block';

    const g = gc(d.grade);
    el.innerHTML = `
        <div class="card-result">
            <div class="card-header">
                <h2>${d.name}</h2>
                <span class="confidence">${(d.confidence * 100).toFixed(0)}%</span>
            </div>
            ${d.card_number ? `<div class="card-num">📋 ${d.card_number}</div>` : ''}
            ${d.raw_ocr ? `<div class="method-tag">OCR read: "${d.raw_ocr}"</div>` : ''}

            <div class="grade-display ${g}">
                <span class="grade-label">Grade</span>
                <span class="grade-value">${d.grade}</span>
                <span class="grade-score">${(d.score * 100).toFixed(1)}% defect</span>
            </div>

            <div class="defect-list">
                <h3>Defects</h3>
                ${Object.entries(d.defects).map(([k,v]) => `
                    <div class="defect-row">
                        <span class="defect-name">${k.replace(/_/g,' ')}</span>
                        ${defBar(v)}
                        <span class="defect-detail">${d.details[k]}</span>
                    </div>
                `).join('')}
            </div>

            <div class="action-buttons">
                <button class="btn btn-price" onclick="lookupPrice()">💰 Look up Price</button>
                <button class="btn btn-save" id="saveBtn" onclick="saveCard()">💾 Save to Collection</button>
            </div>

            <div id="priceBox"></div>

            ${d.debug ? `
            <div class="debug-section">
                <h3>Debug: What the scanner sees</h3>
                <div class="debug-ocr">
                    <p><b>OCR read:</b> ${d.raw_ocr || 'nothing'}</p>
                    <p><b>Card number:</b> ${d.card_number || 'none'}</p>
                </div>
                <div class="debug-images">
                    <div><p>Full card crop:</p><img src="/static/debug_card.jpg?t=${Date.now()}"></div>
                    <div><p>Name region:</p><img src="/static/debug_name.jpg?t=${Date.now()}"></div>
                    <div><p>Number region:</p><img src="/static/debug_number.jpg?t=${Date.now()}"></div>
                </div>
            </div>
            ` : ''}
        </div>`;
}

/* === Price — opens Cardmarket in browser === */
function lookupPrice() {
    if (!_lastScan) return;
    const box = document.getElementById('priceBox');

    const q = _lastScan.name + (_lastScan.card_number ? ' ' + _lastScan.card_number : '');
    const url = 'https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=' + encodeURIComponent(q);
    _price = { found: true, url: url, price_avg: 'N/A', price_low: 'N/A', price_trend: 'N/A' };

    box.innerHTML = `
        <div class="price-result">
            <div class="price-name">Search: ${q}</div>
            <a href="${url}" target="_blank" class="btn btn-price" style="display:block;text-decoration:none;margin-top:.5rem;text-align:center;">
                🔗 Open on Cardmarket
            </a>
        </div>`;
}

/* === Save === */
async function saveCard() {
    if (!_lastScan) return;
    const btn = document.getElementById('saveBtn');
    btn.textContent = '⏳ Saving...';
    btn.disabled = true;

    const payload = {
        name: _lastScan.name,
        card_number: _lastScan.card_number || '',
        grade: _lastScan.grade,
        grade_score: _lastScan.score,
        price_avg: _price?.price_avg || 'N/A',
        price_low: _price?.price_low || 'N/A',
        price_trend: _price?.price_trend || 'N/A',
        cardmarket_url: _price?.url || '',
        defects: _lastScan.defects,
    };

    try {
        const res = await fetch('/save_card', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.success) {
            btn.textContent = '✅ Saved!';
            btn.classList.add('btn-saved');
            updateBadge();
        }
    } catch (e) {
        btn.textContent = '❌ Failed';
        btn.disabled = false;
    }
}

/* === Auto-detect === */
async function pollAuto() {
    try {
        const res = await fetch('/results');
        const data = await res.json();
        const el = document.getElementById('autoResult');
        if (data.auto && data.auto.name) {
            el.style.display = 'block';
            el.innerHTML = `<span class="auto-tag">🔍 Auto-detect:</span> <b>${data.auto.name}</b>`;
        } else {
            el.style.display = 'none';
        }
    } catch (e) {}
}
setInterval(pollAuto, 2000);

/* === Collection === */
async function loadCollection() {
    try {
        const res = await fetch('/collection');
        const data = await res.json();
        const v = data.value;

        document.getElementById('colStats').innerHTML =
            `<span>${v.total_count} cards</span> • <span>Value: <b>€${v.total_eur.toFixed(2)}</b> (${v.priced_count} priced)</span>`;

        if (data.cards.length === 0) {
            document.getElementById('colList').innerHTML =
                '<p class="hint">No cards yet. Scan and save one.</p>';
            return;
        }

        let h = '<table class="col-table"><thead><tr>'
            + '<th>Name</th><th>#</th><th>Grade</th><th>Saved</th><th></th>'
            + '</tr></thead><tbody>';

        data.cards.forEach(c => {
            h += `<tr>
                <td><b>${c.name}</b></td>
                <td>${c.card_number || '-'}</td>
                <td><span class="pill ${gc(c.grade)}">${c.grade}</span></td>
                <td class="date">${c.saved_at}</td>
                <td>
                    ${c.cardmarket_url ? `<a href="${c.cardmarket_url}" target="_blank" class="cm-sm">CM</a>` : ''}
                    <button class="btn-del" onclick="delCard(${c.id})">🗑</button>
                </td>
            </tr>`;
        });
        h += '</tbody></table>';
        document.getElementById('colList').innerHTML = h;
    } catch (e) {
        document.getElementById('colList').innerHTML = `<p class="hint">Error: ${e.message}</p>`;
    }
}

async function delCard(id) {
    if (!confirm('Delete this card?')) return;
    await fetch('/delete_card', { method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}) });
    loadCollection();
    updateBadge();
}

async function updateBadge() {
    try {
        const r = await fetch('/collection');
        const d = await r.json();
        document.getElementById('colBadge').textContent = d.cards.length;
    } catch(e) {}
}
updateBadge();
</script>
</body>
</html>
