<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Grader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>⚡ Pokémon Card Grader</h1>
        <p class="subtitle">Local Vision System &bull; Raspberry Pi 5</p>
    </header>

    <main>
        <section class="video-panel">
            <div class="video-container">
                <img src="/video_feed" alt="Live Camera Feed" id="videoFeed">
                <div class="video-overlay" id="statusOverlay">Connecting...</div>
            </div>
            <div class="video-footer">
                <span id="fpsDisplay">-- FPS</span>
                <span>Reference DB: {{ ref_count }} cards</span>
            </div>
        </section>

        <section class="results-panel">
            <div class="card-info" id="cardInfo">
                <div class="info-placeholder">
                    <p>📷 Point the camera at a Pokémon card</p>
                    <p class="hint">Place the card on a dark, contrasting surface for best detection</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const cardInfo = document.getElementById('cardInfo');
        const statusOverlay = document.getElementById('statusOverlay');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const videoFeed = document.getElementById('videoFeed');

        // Hide overlay once video loads
        videoFeed.onload = () => {
            statusOverlay.style.display = 'none';
        };
        videoFeed.onerror = () => {
            statusOverlay.textContent = 'Camera feed unavailable';
            statusOverlay.style.display = 'flex';
        };

        function gradeClass(grade) {
            const map = {
                'Mint': 'grade-mint',
                'Near Mint': 'grade-nm',
                'Excellent': 'grade-ex',
                'Good': 'grade-good',
                'Poor': 'grade-poor'
            };
            return map[grade] || '';
        }

        function defectBar(score) {
            const pct = Math.round(score * 100);
            let color = '#4caf50';
            if (pct > 60) color = '#f44336';
            else if (pct > 30) color = '#ff9800';
            else if (pct > 10) color = '#ffeb3b';

            return `<div class="defect-bar">
                <div class="defect-fill" style="width:${pct}%; background:${color}"></div>
            </div>`;
        }

        function renderResults(data) {
            if (!data.cards || data.cards.length === 0) {
                cardInfo.innerHTML = `
                    <div class="info-placeholder">
                        <p>📷 Point the camera at a Pokémon card</p>
                        <p class="hint">Place the card on a dark, contrasting surface for best detection</p>
                    </div>`;
                return;
            }

            let html = '';
            data.cards.forEach((card, i) => {
                const gc = gradeClass(card.grade);
                html += `
                <div class="card-result">
                    <div class="card-header">
                        <h2>${card.name}</h2>
                        <span class="confidence">${(card.confidence * 100).toFixed(0)}% match</span>
                    </div>

                    <div class="grade-display ${gc}">
                        <span class="grade-label">Grade</span>
                        <span class="grade-value">${card.grade}</span>
                        <span class="grade-score">${(card.score * 100).toFixed(1)}% defect score</span>
                    </div>

                    <div class="defect-list">
                        <h3>Defect Analysis</h3>
                        ${Object.entries(card.defects).map(([key, val]) => `
                            <div class="defect-row">
                                <span class="defect-name">${key.replace('_', ' ')}</span>
                                ${defectBar(val)}
                                <span class="defect-detail">${card.details[key]}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            });

            if (data.fps) {
                fpsDisplay.textContent = data.fps.toFixed(1) + ' FPS';
            }

            cardInfo.innerHTML = html;
        }

        // Poll results endpoint
        async function fetchResults() {
            try {
                const res = await fetch('/results');
                const data = await res.json();
                renderResults(data);
            } catch (e) {
                // Silently retry
            }
        }

        setInterval(fetchResults, 500);
    </script>
</body>
</html>
